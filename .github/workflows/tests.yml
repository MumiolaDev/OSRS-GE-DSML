# Integración continua: corre la suite de tests en una máquina limpia.
#
# El valor real de correrlos acá y no solo en local es la máquina limpia: si
# un módulo importa algo que está instalado en el entorno del desarrollador
# pero falta en requirements.txt, acá falla y en local no. La suite no toca
# la API real ni una DB del usuario (ver tests/conftest.py), así que no
# necesita secretos, red ni datos previos.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:          # permite dispararlo a mano desde la web

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20       # corta un cuelgue en vez de consumir las 6h del runner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      # PySide6 se importa en tests/test_pagina_modelos.py y sus librerías
      # de sistema no vienen preinstaladas en el runner de Ubuntu.
      - name: Instalar librerías de sistema para Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr los tests
        env:
          # El runner no tiene pantalla: sin esto Qt aborta al inicializarse.
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q
